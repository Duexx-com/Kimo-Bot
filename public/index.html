<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimo Bot - VIP Admin Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #070a12; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
        h1 { font-family: 'Orbitron', sans-serif; color: #00ffcc; letter-spacing: 1.5px; text-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .badge { background: rgba(0,255,204,0.1); border: 1px solid #00ffcc; color: #00ffcc; padding: 3px 10px; border-radius: 20px; font-size: 12px; margin: 8px 0 25px; }
        .card { width: 100%; max-width: 620px; background: #0f1626; border: 1px solid #1e293b; border-radius: 14px; padding: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #38bdf8; font-size: 12px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #172033; border: 1px solid #2d3b55; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #00ffcc; }
        button { width: 100%; padding: 13px; background: linear-gradient(90deg, #00ffcc, #00b8d4); border: none; border-radius: 8px; color: #070a12; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'Orbitron', sans-serif; transition: 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,255,204,0.35); }
        #resultBox { margin-top: 20px; padding: 15px; background: #172033; border-radius: 8px; border-left: 4px solid #00ffcc; display: none; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <h1>KIMO CONTROL PANEL</h1>
    <div class="badge">● SYSTEM ONLINE • RENDER CLOUD</div>

    <div class="card">
        <div class="form-group">
            <label>Admin Dashboard Password</label>
            <input type="password" id="adminKey" placeholder="Enter your ADMIN_PASSWORD from .env">
        </div>

        <div class="form-group">
            <label>Select Command Module</label>
            <select id="actionType" onchange="toggleInputs()">
                <option value="seecash">🔍 Inspect User Full Data</option>
                <option value="moneyadd">💰 Add / Remove KIM Balance</option>
                <option value="addxp">⭐ Add XP & Auto-Level</option>
                <option value="setrank">🛡️ Change Custom Rank</option>
                <option value="addbadge">🏅 Grant Badge Emoji</option>
                <option value="botban">🔨 Bot Ban User</option>
                <option value="botunban">🔓 Bot Unban User</option>
                <option value="reset">⚠️ Reset User Economy</option>
            </select>
        </div>

        <div class="form-group">
            <label>Target Discord User ID</label>
            <input type="text" id="targetId" placeholder="e.g. 1044855120992665630">
        </div>

        <div class="form-group" id="valueGroup">
            <label id="valueLabel">Value / Amount / Reason</label>
            <input type="text" id="valueInput" placeholder="Enter value...">
        </div>

        <button onclick="executeAction()">EXECUTE ACTION</button>
        <div id="resultBox"></div>
    </div>

    <script>
        function toggleInputs() {
            const action = document.getElementById('actionType').value;
            const valGroup = document.getElementById('valueGroup');
            const valLabel = document.getElementById('valueLabel');
            
            if (['seecash', 'botunban', 'reset'].includes(action)) {
                valGroup.style.display = 'none';
            } else {
                valGroup.style.display = 'block';
                const labels = {
                    moneyadd: "Amount (Use -500 to deduct)",
                    addxp: "XP Amount to Add",
                    setrank: "New Rank Title",
                    addbadge: "Badge Emoji (e.g. 👑)",
                    botban: "Ban Reason"
                };
                valLabel.innerText = labels[action] || "Value";
            }
        }

        async function executeAction() {
            const password = document.getElementById('adminKey').value.trim();
            const action = document.getElementById('actionType').value;
            const targetId = document.getElementById('targetId').value.trim();
            const value = document.getElementById('valueInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!password || !targetId) {
                alert('Admin Password and Target User ID are required!');
                return;
            }

            resultBox.style.display = 'block';
            resultBox.innerHTML = '⏳ Executing on Kimo Core...';

            try {
                const res = await fetch('/api/admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, action, targetId, value })
                });
                const data = await res.json();
                resultBox.style.borderLeftColor = data.success ? '#00ffcc' : '#ef4444';
                resultBox.innerHTML = data.success ? `✅ <b>Success:</b><br>${data.message}` : `❌ <b>Error:</b> ${data.error}`;
            } catch (e) {
                resultBox.style.borderLeftColor = '#ef4444';
                resultBox.innerHTML = '❌ Connection failed!';
            }
        }
        toggleInputs();
    </script>
</body>
</html>
